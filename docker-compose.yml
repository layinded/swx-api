services:
  db:
    image: postgres:15
    container_name: czdb
    restart: always
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

  adminer:
    image: adminer
    container_name: czdbdashboard
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=dracula
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.${STACK_NAME}-adminer-http.rule=Host(`adminer.${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME}-adminer-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME}-adminer-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME}-adminer-https.rule=Host(`adminer.${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME}-adminer-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME}-adminer-https.tls=true
      - traefik.http.routers.${STACK_NAME}-adminer-https.tls.certresolver=le
      - traefik.http.services.${STACK_NAME}-adminer.loadbalancer.server.port=8080

  otp-serve:
    container_name: otp
    image: opentripplanner/opentripplanner:latest
    command: --load --serve
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - ./data/otp-data:/var/opentripplanner
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx8g

  nominatim:
    container_name: nominatim
    image: mediagis/nominatim:4.4
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      - NOMINATIM_PG_PASS=nominatim
      - PBF_PATH=/nominatim-data/czech-republic-latest.osm.pbf
    volumes:
      - nominatim-data:/var/lib/postgresql/12/main
      - ./data/nominatim-import:/nominatim-data

  czfb:
    container_name: czfbapi
    image: czfb
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      otp-serve:
        condition: service_started
      nominatim:
        condition: service_started
    networks:
      - traefik-public
      - default
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - DOCKERIZED=true
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SENTRY_DSN=${SENTRY_DSN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.${STACK_NAME}-czfb-http.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME}-czfb-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME}-czfb-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME}-czfb-https.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME}-czfb-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME}-czfb-https.tls=true
      - traefik.http.routers.${STACK_NAME}-czfb-https.tls.certresolver=le
      - traefik.http.services.${STACK_NAME}-czfb.loadbalancer.server.port=8000

volumes:
  app-db-data:
  nominatim-data:

networks:
  traefik-public:
    external: true
